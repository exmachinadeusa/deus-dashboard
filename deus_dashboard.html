function drawScene(cv,ag,fr){
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,S=Math.max(2,Math.floor(W/52));
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=ag.bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=.5;
  for(let i=0;i<W;i+=S*4){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let j=0;j<H;j+=S*4){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke()}
  const dx=W-S*13,dy=H-S*7;
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(dx,dy,S*12,S*2);ctx.fillRect(dx,dy+S*2,S*2,S*5);ctx.fillRect(dx+S*10,dy+S*2,S*2,S*5);
  ctx.fillStyle='rgba(255,255,255,0.09)';ctx.fillRect(dx+S*2,dy-S*7,S*8,S*7);
  ctx.fillStyle=ag.cc+'33';ctx.fillRect(dx+S*3,dy-S*6,S*6,S*5);
  ctx.fillStyle=ag.cc+'99';
  for(let l=0;l<4;l++)ctx.fillRect(dx+S*4,dy-S*6+S+l*S*1.1,S*(3-l%2),S*.8);
  if(fr%40<20){ctx.fillStyle=ag.cc;ctx.fillRect(dx+S*4,dy-S*2,S*.8,S*.9)}
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(W-S*4,S*2,S*3,H-S*10);
  for(let r=0;r<5;r++){if((fr+r*15)%60<30){ctx.fillStyle=ag.cc+'88';ctx.fillRect(W-S*3,S*3+r*S*3,S,S)}}
  const bob=Math.sin(fr*.07)>0?0:-S;
  const cx=S*4,cy=H-S*16+bob,f='#ffddaa',c=ag.cc,d=ag.dc;
  if(ag.id==='julian'){
    ctx.fillStyle=d;ctx.fillRect(cx+S,cy,S*7,S);ctx.fillRect(cx+S*2,cy+S,S*5,S*2);
    ctx.fillStyle=f;ctx.fillRect(cx+S*2,cy+S*3,S*5,S*3);
    ctx.fillStyle=c;ctx.fillRect(cx+S,cy+S*6,S*7,S*5);
    ctx.fillStyle='#fff';ctx.fillRect(cx+S*3,cy+S*6,S,S);ctx.fillRect(cx+S*5,cy+S*6,S,S);
    ctx.fillStyle='#cc0000';ctx.fillRect(cx+S*4,cy+S*7,S,S*3);
    ctx.fillStyle=d;ctx.fillRect(cx+S*2,cy+S*11,S*2,S*4);ctx.fillRect(cx+S*5,cy+S*11,S*2,S*4);
  }else if(ag.id==='ricky'){
    ctx.fillStyle='#553300';ctx.fillRect(cx+S*2,cy,S*5,S);
    ctx.fillStyle=f;ctx.fillRect(cx+S*2,cy+S,S*5,S*3);
    ctx.fillStyle='#bb8855';ctx.fillRect(cx+S*3,cy+S*3,S*3,S*.7);
    ctx.fillStyle=c;ctx.fillRect(cx+S,cy+S*4,S*7,S*5);
    ctx.fillRect(cx,cy+S*4,S,S*3);ctx.fillRect(cx+S*8,cy+S*4,S,S*3);
    ctx.fillStyle='#334466';ctx.fillRect(cx+S*2,cy+S*9,S*2,S*4);ctx.fillRect(cx+S*5,cy+S*9,S*2,S*4);
  }else if(ag.id==='bubbles'){
    ctx.fillStyle='#774422';ctx.fillRect(cx+S,cy,S*7,S);ctx.fillRect(cx,cy+S,S,S*2);ctx.fillRect(cx+S*8,cy+S,S,S*2);
    ctx.fillStyle=f;ctx.fillRect(cx+S,cy+S,S*7,S*4);
    ctx.fillStyle='#888';ctx.fillRect(cx+S,cy+S*2,S*3,S*2);ctx.fillRect(cx+S*5,cy+S*2,S*3,S*2);ctx.fillRect(cx+S*4,cy+S*3,S,S);
    ctx.fillStyle='#00aaff';ctx.fillRect(cx+S*2,cy+S*2,S,S);ctx.fillRect(cx+S*6,cy+S*2,S,S);
    ctx.fillStyle=c;ctx.fillRect(cx+S*2,cy+S*5,S*5,S*5);
    ctx.fillStyle=d;ctx.fillRect(cx+S*2,cy+S*10,S*2,S*4);ctx.fillRect(cx+S*5,cy+S*10,S*2,S*4);
  }else if(ag.id==='randy'){
    ctx.fillStyle=f;ctx.fillRect(cx+S*2,cy,S*6,S*4);
    ctx.fillStyle='#663300';ctx.fillRect(cx+S*2,cy+S*3,S*6,S);
    ctx.fillStyle='#e0aa88';ctx.fillRect(cx+S,cy+S*4,S*8,S*6);
    ctx.fillStyle='#cc9966';ctx.fillRect(cx+S*4,cy+S*8,S,S);
    ctx.fillStyle=d;ctx.fillRect(cx+S,cy+S*10,S*8,S);
    ctx.fillStyle='#ffcc00';ctx.fillRect(cx+S*4,cy+S*10,S*2,S);
    ctx.fillStyle='#334466';ctx.fillRect(cx+S*2,cy+S*11,S*2,S*4);ctx.fillRect(cx+S*6,cy+S*11,S*2,S*4);
  }else if(ag.id==='lahey'){
    ctx.fillStyle=d;ctx.fillRect(cx,cy,S*9,S);ctx.fillRect(cx+S*2,cy+S,S*5,S*2);
    ctx.fillStyle=f;ctx.fillRect(cx+S*2,cy+S*3,S*5,S*3);
    ctx.fillStyle=c;ctx.fillRect(cx+S,cy+S*6,S*7,S*5);
    ctx.fillStyle='#ffee00';ctx.fillRect(cx+S*2,cy+S*7,S*2,S*2);
    ctx.fillStyle=d;ctx.fillRect(cx+S*2,cy+S*11,S*2,S*4);ctx.fillRect(cx+S*5,cy+S*11,S*2,S*4);
    if(fr%100<50){ctx.fillStyle=ag.cc+'bb';ctx.font=(S*2.5)+'px monospace';ctx.fillText('z',cx+S*10,cy+S*2);ctx.fillText('Z',cx+S*11.5,cy-S)}
  }else{
    ctx.fillStyle=d;ctx.fillRect(cx,cy,S*9,S*2);ctx.fillRect(cx-S,cy,S,S);ctx.fillRect(cx+S*9,cy,S,S);
    ctx.fillStyle='#cc9966';ctx.fillRect(cx+S*2,cy+S*2,S*5,S*3);
    ctx.fillStyle='#ffcc00';ctx.fillRect(cx+S*3,cy+S*5,S*4,S);
    ctx.fillStyle=c;ctx.fillRect(cx+S,cy+S*5,S*7,S*5);
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(cx+S,cy+S*5,S,S*5);ctx.fillRect(cx+S*7,cy+S*5,S,S*5);
    ctx.fillStyle=d;ctx.fillRect(cx+S*2,cy+S*10,S*2,S*4);ctx.fillRect(cx+S*5,cy+S*10,S*2,S*4);
  }
  if(fr%30<15){ctx.fillStyle=ag.cc;ctx.fillRect(cx+S*4,cy-S*2,S,S)}
}

    <div class="section-hdr"><span>MALIYET TABLOSU</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Model</th><th>Gunluk</th><th>Aylik</th><th>Prompt Cache</th><th>Not</th></tr></thead><tbody>
    <tr><td style="color:var(--amber)">Kural Motoru</td><td style="color:#5aaa5a">$0.00</td><td style="color:#5aaa5a">$0.00</td><td class="mono-sm">-</td><td class="mono-sm">regex in-memory</td></tr>
    <tr><td style="color:var(--green)">qwen2.5:7b (Ollama)</td><td style="color:#5aaa5a">$0.00</td><td style="color:#5aaa5a">$0.00</td><td class="mono-sm">-</td><td class="mono-sm">lokal GPU/CPU</td></tr>

  async operator(){

const TITLES={mission:'MISSION CONTROL',kasa:'KASA',islemler:'ISLEMLER',eskalasyon:'ESKALASYONLAR',kb:'BILGI BANKASI',routing:'ROUTING & MALIYET',operator:'OPERATORLER'};
async function navigate(section){
  cur=section;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.s===section));
  $('tb-title').textContent=TITLES[section]||section.toUpperCase();
  $('content').innerHTML='<div class="loading">Yukleniyor</div>';
  if(section!=='mission')stopAnim();
  try{const html=await SECTIONS[section]();$('content').innerHTML=html;if(section==='mission')startAnim()}
  catch(e){$('content').innerHTML=`<div style="color:var(--red);padding:20px;font-size:9px">Hata: ${e.message}</div>`;toast(e.message,'err')}
}
async function refresh(){await navigate(cur)}
function startAnim(){
  if(animRun)return;animRun=true;
  const grid=$('agentRooms');if(!grid)return;grid.innerHTML='';
  AGENTS.forEach(ag=>{
    const d=document.createElement('div');d.className='room';d.style.background=ag.bg;
    d.innerHTML=`<div class="rh"><span class="rn" style="color:${ag.nc}">${ag.name}</span><span class="rb" style="color:${ag.bc};background:${ag.bbg};border:.5px solid ${ag.bc}44">${ag.badge}</span></div><div class="bbl-wrap"><div class="bbl" id="bbl-${ag.id}" style="color:${ag.cc};background:${ag.cc}0e;border-color:${ag.cc}44">${ag.msgs[0]}</div></div><div class="rs"><canvas id="cv-${ag.id}" width="160" height="100"></canvas></div><div class="rf"><span class="rrl" style="color:${ag.nc}66">${ag.role}</span><span class="rst" style="color:${ag.sc}">● ${ag.stat}</span></div>`;
    grid.appendChild(d);
  });
  function loop(){
    if(!animRun||cur!=='mission'){animRun=false;return}
    animF++;
    AGENTS.forEach((ag,i)=>{
      const cv=$('cv-'+ag.id);if(cv)drawScene(cv,ag,animF);
      if(animF%(190+i*17)===0){
        msgIdx[ag.id]=(msgIdx[ag.id]+1)%ag.msgs.length;
        const b=$('bbl-'+ag.id);
        if(b){b.style.opacity='0';setTimeout(()=>{b.textContent=ag.msgs[msgIdx[ag.id]];b.style.opacity='1'},250)}
      }
    });
    animFrame=requestAnimationFrame(loop);
  }
  loop();
}
function stopAnim(){animRun=false;if(animFrame){cancelAnimationFrame(animFrame);animFrame=null}}
function filterTable(tbodyId,q){document.querySelectorAll('#'+tbodyId+' tr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'})}
function filterByField(tbodyId,field,val){document.querySelectorAll('#'+tbodyId+' tr').forEach(r=>{r.style.display=!val||r.dataset[field]===val?'':'none'})}
function filterKB(q){document.querySelectorAll('#kb-list .kb-card').forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'})}
function filterKBCat(cat){document.querySelectorAll('#kb-list .kb-card').forEach(c=>{c.style.display=!cat||c.dataset.cat===cat?'':'none'})}
$('tick-txt').textContent=['Ollama aktif - qwen2.5:7b $0','%98 routing ucretsiz','OPUS YASAK - model kilidi aktif','Pazar 03:00 haftalik ogrenme planlanadi','Gece 23:00 guvenlik denetimi aktif','Sabah 08:00 raporu planlanadi','DEUS v2.0 - 7/24 otonom calisiyor','KB: 847+ giris - %96 basari orani','4 PM2 cron: reconcile morning security learning'].join('   ..   ');
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('tr-TR')},1000);
document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.s)));
setInterval(refresh,CFG.REFRESH_MS);
navigate('mission');
</script>
